<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSK Forum</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>NSK Forum</h1>

  <!-- FORMULAIRE USER -->
  <form id="contactForm">
    <input type="text" id="name" placeholder="Votre nom" required>
    <input type="email" id="email" placeholder="Votre email" required>
    <textarea id="message" placeholder="Votre message" required></textarea>

    <button type="submit">Envoyer</button>
  </form>

  <p id="status"></p>

  <hr style="opacity:0.1;margin:20px 0;">

  <!-- LISTE MESSAGES -->
  <h2>Messages</h2>
  <div id="messages"></div>

  <!-- ADMIN PANEL -->
  <div class="box" id="adminBox">
    <h3>Admin Panel</h3>

    <input type="password" id="adminPass" placeholder="Mot de passe admin">
    <button onclick="loginAdmin()">Se connecter</button>

    <div id="adminPanel" style="display:none;">
      <textarea id="replyText" placeholder="Répondre..."></textarea>
      <button onclick="replyMessage()">Envoyer réponse</button>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
