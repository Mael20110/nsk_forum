<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSK Forum PRO</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>NSK Forum PRO</h1>

<!-- ======================
     FORMULAIRE
====================== -->
<form id="form">
  <input id="name" placeholder="Nom" required>
  <input id="email" placeholder="Email" required>
  <textarea id="text" placeholder="Message" required></textarea>
  <button>Envoyer</button>
</form>

<!-- ======================
     SEARCH
====================== -->
<input id="search" placeholder="Rechercher...">

<!-- ======================
     MESSAGES
====================== -->
<div id="messages"></div>

<hr>

<!-- ======================
     ADMIN PANEL
====================== -->
<div class="box">

  <h3>Admin Panel</h3>

  <input id="pass" type="password" placeholder="Mot de passe">
  <button onclick="login()">Login</button>

  <div id="admin" style="display:none;">

    <!-- MESSAGE SELECTION -->
    <p><b>Message sélectionné :</b></p>
    <div id="selected">Aucun</div>

    <!-- REPLY -->
    <textarea id="reply" placeholder="Réponse admin"></textarea>
    <button onclick="reply()">Envoyer réponse</button>

    <!-- BAN SELECTED -->
    <button onclick="banSelected()">🚫 Bannir message sélectionné</button>

    <!-- COMMANDS -->
    <input id="cmd" placeholder="ban <id>">
    <button onclick="runCmd()">Run commande</button>

  </div>

</div>

</div>

<!-- ======================
     JS
====================== -->
<script type="module" src="app.js"></script>

</body>
</html>
