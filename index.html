<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSK Forum PRO</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>NSK Forum PRO</h1>

  <!-- FORM -->
  <form id="contactForm">
    <input type="text" id="name" placeholder="Nom" required>
    <input type="email" id="email" placeholder="Email" required>
    <textarea id="message" placeholder="Message" required></textarea>
    <button>Envoyer</button>
  </form>

  <input type="text" id="search" placeholder="Rechercher un message...">

  <div id="messages"></div>

  <hr style="opacity:0.1">

  <!-- ADMIN -->
  <div class="box">
    <h3>Admin Panel</h3>

    <input type="password" id="adminPass" placeholder="Mot de passe">
    <button onclick="loginAdmin()">Login</button>

    <div id="adminPanel" style="display:none;">

      <p>Message sélectionné :</p>
      <div id="selectedMsg">Aucun</div>

      <textarea id="replyText" placeholder="Réponse"></textarea>
      <button onclick="reply()">Répondre</button>

      <input id="cmd" placeholder="Commande (delete 1 / clear / export)">
      <button onclick="runCmd()">Run</button>

      <button onclick="exportData()">Exporter JSON</button>

      <button onclick="resetAll()" style="background:red;color:white;">
        Reset
      </button>

    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
