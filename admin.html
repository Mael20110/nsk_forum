<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>NSK Admin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h1>NSK Forum Admin</h1>

  <button onclick="clearAll()">🗑 Vider tous les messages</button>

  <div id="messages"></div>
</div>

<script>
const ADMIN_PASSWORD = "nskcreateyoursab*";

// sécurité admin propre
function checkAuth(){
  const pass = localStorage.getItem("admin_pass");

  if(pass !== ADMIN_PASSWORD){
    const input = prompt("Mot de passe admin NSK :");

    if(input !== ADMIN_PASSWORD){
      alert("Accès refusé");
      window.location.href = "index.html";
    } else {
      localStorage.setItem("admin_pass", input);
    }
  }
}

checkAuth();

const container = document.getElementById("messages");

function loadMessages(){
  container.innerHTML = "";

  let messages = JSON.parse(localStorage.getItem("messages")) || [];
  messages = messages.reverse();

  messages.forEach((msg, index) => {

    container.innerHTML += `
      <div class="box">

        <div style="opacity:0.6;font-size:12px">
          ${msg.date}
        </div>

        <div class="status ${msg.status}">
          ${msg.status === "answered" ? "Répondu" : "En attente"}
        </div>

        <p><b>${msg.name}</b> (${msg.email})</p>

        <div style="margin:10px 0;padding:10px;background:#0b0b0b;border-radius:10px;">
          ${msg.message}
        </div>

        <textarea id="r${index}" placeholder="Réponse admin">
${msg.response || ""}
        </textarea>

        <button onclick="saveResponse(${index})">Répondre</button>
        <button onclick="deleteMsg(${index})">Supprimer</button>

      </div>
    `;
  });
}

function saveResponse(i){
  let messages = JSON.parse(localStorage.getItem("messages")) || [];

  messages[i].response = document.getElementById("r"+i).value;
  messages[i].status = "answered";

  localStorage.setItem("messages", JSON.stringify(messages));

  alert("Réponse sauvegardée !");
  loadMessages();
}

function deleteMsg(i){
  let messages = JSON.parse(localStorage.getItem("messages")) || [];

  messages.splice(i, 1);

  localStorage.setItem("messages", JSON.stringify(messages));

  loadMessages();
}

function clearAll(){
  if(confirm("Supprimer TOUS les messages ?")){
    localStorage.removeItem("messages");
    loadMessages();
  }
}

loadMessages();
</script>

</body>
</html>
