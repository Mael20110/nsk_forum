<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>NSK Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Admin NSK Forum</h1>

    <div id="messages"></div>
  </div>

  <script>
    let messages = JSON.parse(localStorage.getItem("messages")) || [];
    const container = document.getElementById("messages");

    function loadMessages(){
      container.innerHTML = "";

      messages.forEach((msg, index) => {
        container.innerHTML += `
          <div class="box">
            <p><b>Nom:</b> ${msg.name}</p>
            <p><b>Email:</b> ${msg.email}</p>
            <p><b>Message:</b> ${msg.message}</p>
            <p><b>Date:</b> ${msg.date}</p>

            <textarea placeholder="Réponse admin" id="r${index}">${msg.response}</textarea>

            <button onclick="saveResponse(${index})">Répondre</button>
            <button onclick="deleteMsg(${index})">Supprimer</button>

            <hr>
          </div>
        `;
      });
    }

    function saveResponse(i){
      let messages = JSON.parse(localStorage.getItem("messages")) || [];
      messages[i].response = document.getElementById("r"+i).value;
      localStorage.setItem("messages", JSON.stringify(messages));
      alert("Réponse sauvegardée !");
    }

    function deleteMsg(i){
      let messages = JSON.parse(localStorage.getItem("messages")) || [];
      messages.splice(i, 1);
      localStorage.setItem("messages", JSON.stringify(messages));
      loadMessages();
    }

    loadMessages();
  </script>

</body>
</html>
